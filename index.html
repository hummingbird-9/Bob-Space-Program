<title>Bob Space Program</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>

    margin: 0; height: 100%; overflow: hidden;
    background: #020813; color: #ebf3ff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #app {
    display: flex; width: 100vw; height: 100vh;
  }
  #sidebar {
    width: 340px; background: rgba(6, 12, 22, 0.9);
    border-right: 1px solid rgba(255,255,255,0.06);
    padding: 12px 12px 18px 12px; overflow: auto;
  }
  #viewportWrap {
    position: relative; flex: 1; background: black;
  }
  #viewport {
    width: 100%; height: 100%; display: block;
  }
  .tabbar {
    display: flex; gap: 6px; margin-bottom: 12px;
  }
  .tab {
    flex: 1; text-align: center; padding: 8px;
    background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 6px; cursor: pointer; user-select: none;
  }
  .tab.active {
    background: #14314f; border-color: rgba(255,255,255,0.12);
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }
  .small { font-size: 12px; opacity: 0.8; }
  .buttonRow { display: flex; gap: 8px; flex-wrap: wrap; }
  button, select, input {
    background: #122337; color: white; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px; padding: 7px 8px; font-size: 13px;
    cursor: pointer;
  }
  #partsPalette {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;
  }
  .partButton {
    width: 92px; padding: 8px 4px; border-radius: 6px;
    background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
    cursor: pointer; text-align: center; font-size: 12px;
  }
  #assemblyList {
    min-height: 120px; background: rgba(255,255,255,0.02);
    border-radius: 8px; padding: 8px; border: 1px solid rgba(255,255,255,0.04);
    display: flex; flex-direction: column; gap: 4px;
  }
  .assemblyItem {
    display:flex; justify-content:space-between; align-items:center;
    padding: 6px 4px; border-bottom: 1px dashed rgba(255,255,255,0.05);
    background: rgba(255,255,255,0.01); border-radius: 4px;
  }
  .assemblyItem:last-child { border-bottom: none; }
  .removePartBtn {
    background: #4a1515; border: none; padding: 2px 6px; border-radius: 4px; font-size: 11px;
  }
  .hud {
    position: absolute; left: 12px; top: 12px; z-index: 5;
    background: rgba(7, 13, 18, 0.75); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; padding: 8px 10px; font-size: 12px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="tabbar">
      <div class="tab active" data-tab="hangar">VAB</div>
      <div class="tab" data-tab="flight">Flight</div>
      <div class="tab" data-tab="planner">Maneuvers</div>
    </div>

    <div id="hangar" class="panel active">
      <div class="row"><strong>Vehicle Assembly</strong></div>
      <div class="row"><span>Parts</span></div>
      <div id="partsPalette"></div>

      <div class="row" style="margin-top:12px"><span>Assembly (Top to Bottom)</span></div>
      <div id="assemblyList"></div>

      <div class="buttonRow" style="margin-top:10px">
        <button id="saveDesign">Save</button>
        <button id="loadDesign">Load</button>
        <button id="launchBtn">Launch</button>
      </div>

      <div style="margin-top:10px; line-height:1.8">
        <div class="row"><span>Mass</span><span id="massStat">0 kg</span></div>
        <div class="row"><span>Thrust</span><span id="thrustStat">0 N</span></div>
        <div class="row"><span>Fuel</span><span id="fuelStat">0 kg</span></div>
        <div class="row"><span>CoM</span><span id="comStat">0 m</span></div>
      </div>
    </div>

    <div id="flight" class="panel">
      <div class="row"><strong>Flight Controls</strong></div>

      <div class="row">
        <span>Planet</span>
        <select id="planetSelect"></select>
      </div>

      <div class="row"><span>Throttle</span><span id="throttleStat">0%</span></div>

      <div class="row"><span>Speed</span><span id="speedStat">0 m/s</span></div>

        <button id="stageBtn">Stage / Fire Engine</button>
        <button id="abortBtn">Recover Vessel</button>
      </div>

      <div class="row" style="margin-top:8px">
        <span>Quality</span>
        <select id="qualitySelect">
          <option value="high">High</option>
          <option value="med">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>

    </div>

      <div>Mode: <span id="modeLabel">Hangar</span></div>
    </div>
    <canvas id="viewport"></canvas>

// --- VEHICLE ASSEMBLY ENGINE ---
function populatePalette() {
els.partsPalette.innerHTML = "";
PARTS.forEach(part => {
const btn = document.createElement("button");
btn.className = "partButton";
btn.textContent = part.name;
btn.onclick = () => addPart(part.id);
els.partsPalette.appendChild(btn);
});
}
function findPart(id) {
return PARTS.find(p => p.id === id);
}
function initAssembly() {
assembly = DEFAULT_ASSEMBLY.map(a => findPart(a.partId));
rebuildVesselVisuals();
updateAssemblyStats();
}
function addPart(id) {
const part = findPart(id);
if (part) {
assembly.push(part);
rebuildVesselVisuals();
updateAssemblyStats();
}
}
function removePart(index) {
assembly.splice(index, 1);
rebuildVesselVisuals();
updateAssemblyStats();
}
function updateAssemblyStats() {
let totalMass = 0;
let totalThrust = 0;
let totalFuel = 0;
els.assemblyList.innerHTML = "";
assembly.forEach((part, index) => {
totalMass += part.dry + part.fuel;
totalThrust += part.thrust;
totalFuel += part.fuel;
// Update Hangar List View UI
const item = document.createElement("div");
item.className = "assemblyItem";
item.innerHTML = <span>${part.name}</span>;
const delBtn = document.createElement("button");
delBtn.className = "removePartBtn";
delBtn.textContent = "X";
delBtn.onclick = () => removePart(index);
item.appendChild(delBtn);
els.assemblyList.appendChild(item);
});
els.massStat.textContent = ${totalMass} kg;
els.thrustStat.textContent = ${totalThrust} N;
els.fuelStat.textContent = ${totalFuel} kg;
els.comStat.textContent = ${(assembly.length * 0.5).toFixed(1)} m;
// Cache computed dry configurations for flight drop transfers
flightState.totalMass = totalMass;
flightState.vesselThrust = totalThrust;
flightState.currentFuel = totalFuel;
}
function rebuildVesselVisuals() {
// Clear out old 3D models
while(vesselGroup.children.length > 0) {
vesselGroup.remove(vesselGroup.children[0]);
}
let currentY = 0;
assembly.forEach((part) => {
let geometry;
if (part.type === "cmd") {
geometry = new THREE.ConeGeometry(0.6, 1.2, 16);
} else if (part.type === "engine") {
geometry = new THREE.CylinderGeometry(0.4, 0.6, 0.8, 16);
} else {
geometry = new THREE.CylinderGeometry(0.6, 0.6, 1.5, 16);
}
const material = new THREE.MeshStandardMaterial({ color: part.color, roughness: 0.5 });
const mesh = new THREE.Mesh(geometry, material);
// Stack parts down sequentially along the stack
mesh.position.y = currentY;
currentY -= (part.type === "cmd" ? 1.0 : part.type === "engine" ? 0.8 : 1.5);
vesselGroup.add(mesh);
});
// Center camera alignment view on build boundaries
vesselGroup.position.y = -currentY / 2;
}
// --- FLIGHT MATH AND SIMULATION CORNER ---
function populatePlanets() {
els.planetSelect.innerHTML = "";
PLANETS.forEach(p => {
const opt = document.createElement("option");
opt.value = p.id;
opt.textContent = p.name;
els.planetSelect.appendChild(opt);
});
els.planetSelect.onchange = (e) => {
currentPlanet = PLANETS.find(p => p.id === e.target.value);
resetFlight();
};
}
function resetFlight() {
flightState.posX = 0;
flightState.posY = currentPlanet.radius + 10;
flightState.velX = 0;
flightState.velY = 0;
flightState.rotation = Math.PI / 2;
throttle = 0;
}
els.launchBtn.onclick = () => {
if (assembly.length === 0) {
alert("Build a stage assembly layout configuration vector before launching!");
return;
}
mode = "flight";
els.modeLabel.textContent = "In Flight";
switchTab("flight");
resetFlight();
};
els.abortBtn.onclick = () => {
mode = "hangar";
els.modeLabel.textContent = "Hangar";
switchTab("hangar");
updateAssemblyStats();
rebuildVesselVisuals();
vesselGroup.rotation.set(0, 0, 0);
};
els.stageBtn.onclick = () => {
if(throttle === 0) throttle = 100;
else alert("Vessel engines armed and performing active burn configuration steps!");
};
// Keyboard Hook bindings tailored safely for Chromebook performance layouts
window.addEventListener("keydown", (e) => {
if (mode !== "flight") return;
if (e.key === "w" || e.key === "ArrowUp") throttle = Math.min(100, throttle + 10);
if (e.key === "s" || e.key === "ArrowDown") throttle = Math.max(0, throttle - 10);
if (e.key === "a" || e.key === "ArrowLeft") flightState.rotation += 0.1;
if (e.key === "d" || e.key === "ArrowRight") flightState.rotation -= 0.1;
if (e.key === " ") {
e.preventDefault();
throttle = throttle === 0 ? 100 : 0;
}
});
// Main Loop Running Step Functions
let lastTime = performance.now();
function animate() {
requestAnimationFrame(animate);
const now = performance.now();
let dt = (now - lastTime) / 1000;
if (dt > 0.1) dt = 0.1; // Protect against huge background window frame drops
lastTime = now;
if (mode === "hangar") {
// Slow showcase spin routine in the assembly bay
vesselGroup.rotation.y += 0.01;
} else if (mode === "flight") {
// 1. Calculations: Position Vector Normals
let r2 = flightState.posX * flightState.posX + flightState.posY * flightState.posY;
let r = Math.sqrt(r2);
let normX = flightState.posX / r;
let normY = flightState.posY / r;
let altitude = r - currentPlanet.radius;
// 2. Gravitational forces calculation loop step updates
let gAcc = currentPlanet.mu / r2;
let forceX = -gAcc * flightState.totalMass * normX;
let forceY = -gAcc * flightState.totalMass * normY;
// 3. Atmospheric Profile calculations
if (currentPlanet.atmosphere > 0 && altitude < currentPlanet.atmosphere) {
let rho = currentPlanet.rho0 * Math.exp(-altitude / currentPlanet.scaleHeight);
let speed = Math.sqrt(flightState.velX * flightState.velX + flightState.velY * flightState.velY);
if (speed > 0.1) {
// Flattened combined generic drag area configuration coefficients profiles
let dragMag = 0.5 * rho * speed * speed * 0.4 * 1.2;
forceX -= dragMag * (flightState.velX / speed);
forceY -= dragMag * (flightState.velY / speed);
}
}
// 4. Actively burning engine profiles updates step variables
if (throttle > 0 && flightState.currentFuel > 0) {
let thrustMag = flightState.vesselThrust * (throttle / 100);
let tX = Math.cos(flightState.rotation) * thrustMag;
let tY = Math.sin(flightState.rotation) * thrustMag;
forceX += tX;
forceY += tY;
// Consume fuel mass metrics
let fuelBurned = (thrustMag / (320 * 9.81)) * dt;
flightState.currentFuel = Math.max(0, flightState.currentFuel - fuelBurned);
flightState.totalMass = Math.max(100, flightState.totalMass - fuelBurned);
if (flightState.currentFuel <= 0) {
flightState.vesselThrust = 0;
throttle = 0;
}
}
// 5. Integrate forces using standard Newtonian Euler steps
let accX = forceX / flightState.totalMass;
let accY = forceY / flightState.totalMass;
flightState.velX += accX * dt;
flightState.velY += accY * dt;
flightState.posX += flightState.velX * dt;
flightState.posY += flightState.velY * dt;
// Ground Collision Crash Check Mechanics
if (altitude <= 0) {
let impactVelocity = Math.sqrt(flightState.velX * flightState.velX + flightState.velY * flightState.velY);
if (impactVelocity > 12) {
alert(Vessel crashed hard into the surface at ${impactVelocity.toFixed(1)} m/s! Bob had to bail out!);
} else {
alert("Safe landing confirmation achieved!");
}
resetFlight();
altitude = 0;
}
// 6. Push transformations smoothly over into Three space rendering views
vesselGroup.rotation.z = flightState.rotation - Math.PI / 2;
// Flight telemetry update outputs
els.throttleStat.textContent = ${throttle}%;
els.altStat.textContent = ${Math.round(altitude).toLocaleString()} m;
els.speedStat.textContent = ${Math.round(Math.sqrt(flightState.velX*flightState.velX + flightState.velY*flightState.velY))} m/s;
els.fuelFlight.textContent = ${Math.round(flightState.currentFuel)} kg;
}
// Viewport resize calculations
const width = canvas.clientWidth;
const height = canvas.clientHeight;
if (canvas.width !== width || canvas.height !== height) {
renderer.setSize(width, height, false);
camera.aspect = width / height;
camera.updateProjectionMatrix();
}
renderer.render(scene, camera);
}
// Initial Runtime Boot Steps Loop
populatePalette();
populatePlanets();
initAssembly();
requestAnimationFrame(animate);
})();
